[project]
name = "maze-agent"
version = "0.1.0"
description = "A LangGraph agent escaping mazes of rising difficulty"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
